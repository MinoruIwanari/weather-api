<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Fetch関数でAPIを叩く</title>
</head>
<body>
  <h2>Fetch関数でAPIを叩く</h2>
  <p id="log">取得中...</p>

  <script>
    // fetchを使ってAPIからユーザー情報を取得
    fetch("https://jsonplaceholder.typicode.com/users/1")
      // アロー関数の省略記法（response => response.json()）
      .then(response => response.json())
      .then(data => {
        document.getElementById("log").textContent = "名前: " + data.name;
      });
  </script>
</body>
</html>
