<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>明日の天気・最低気温・最高気温</title>
  </head>
  <body>
    <h2>明日の天気・最低気温・最高気温</h2>
    <form id="weatherForm" method="get">
      <p>
        <label for="wcode">地域</label>
        <select name="wcode" id="wcode">
          <option value="016000">札幌</option>
          <option value="130000">東京</option>
          <option value="270000">大阪</option>
          <option value="230000">名古屋</option>
          <option value="140000">横浜</option>
          <option value="110000">熊谷</option>
          <option value="040000">仙台</option>
          <option value="340000">広島</option>
          <option value="400000">福岡</option>
        </select>
      </p>
    </form>

    <button id="weather">取得</button>
    <hr />
    <div id="result"></div>

    <script>
      const weatherBtn = document.getElementById("weather");
      const resultDiv = document.getElementById("result");

      weatherBtn.addEventListener("click", () => {
        const code = document.getElementById("wcode").value;

        fetch(`https://www.jma.go.jp/bosai/forecast/data/forecast/${code}.json`)
          .then((res) => {
            if (!res.ok) throw new Error("通信エラー");
            return res.json();
          })
          .then((data) => {
            const weatherText = data[0].timeSeries[0].areas[0].weathers[1]; // 明日の天気

            const tempsMin = data[1].timeSeries[1].areas[0].tempsMin[1];
            const tempsMax = data[1].timeSeries[1].areas[0].tempsMax[1];

            resultDiv.innerHTML = `
              <strong>明日の天気：</strong> ${weatherText}<br>
              <strong>明日の最低気温：</strong> ${tempsMin}℃<br>
              <strong>明日の最高気温：</strong> ${tempsMax}℃
            `;
          })
          .catch((error) => {
            alert("エラーが発生しました: " + error.message);
          });
      });
    </script>
  </body>
</html>
