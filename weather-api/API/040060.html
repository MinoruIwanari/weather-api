<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>引数ありのアロー関数</title>
</head>
<body>
  <h2>引数ありのアロー関数</h2>
  <p id="result"></p>

  <script>
    // 通常のアロー関数
    const getDouble = (n) => {
      return n * 2;
    };

    // 実行して結果を表示
    const double = getDouble(4); // → 8
    
    document.getElementById("result").textContent =
      "2倍: " + double ;
  </script>
</body>
</html>
